<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Shield: check a Solana token before you add liquidity</title>
<meta name="description" content="Free Solana token risk checker. See mint power, freeze power, big wallets and pool age in plain English or Pidgin.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pool Shield: check a Solana token before you add liquidity">
<meta property="og:description" content="Free risk checker for Solana pools, in plain English or Pidgin. Built by a LAUTECH cybersecurity student.">
<meta name="theme-color" content="#0A3D62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--tile:#F2F9F8;--deep:#0A3D62;--aqua:#1496A6;--ok:#2E9E6B;--warn:#E9A23B;--bad:#D9482B;--unk:#8A9BA8;--line:#CFE5E3}
*{box-sizing:border-box}
body{margin:0;background:var(--tile);color:var(--deep);font-family:"Familjen Grotesk",system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:28px 20px 56px}
.top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.top button{padding:6px 12px;background:#fff;color:var(--deep);border:2px solid var(--deep);font-size:.85rem}
.top button[aria-pressed=true]{background:var(--deep);color:#fff}
h1{font-size:2.4rem;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.lead{margin:0 0 28px;font-size:1.1rem;max-width:46ch}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 280px;padding:14px;border:2px solid var(--deep);border-radius:6px;font:inherit;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;background:#fff;color:var(--deep)}
button{padding:14px 22px;border:0;border-radius:6px;background:var(--deep);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--aqua)}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
#out{margin-top:32px}
.strip{display:flex;gap:4px;padding:6px;background:#fff;border:2px solid var(--deep);border-radius:6px;max-width:420px}
.pad{flex:1;height:34px;border-radius:3px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.unknown{background:var(--unk)}.info{background:var(--aqua)}
h2{font-size:1.9rem;margin:18px 0 2px}
.tok{margin:0 0 4px;font-weight:600}
.meta{margin:0 0 8px;color:#3d6580}
.meta a{color:var(--aqua)}
.tip{margin:0 0 12px;font-size:.9rem;color:#3d6580}
.row{display:flex;gap:12px;padding:0;border-top:1px solid var(--line)}
.row i{flex:none;width:6px;border-radius:3px;margin:12px 0}
details{flex:1;padding:12px 0}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary b{display:block}
summary span{color:#3d6580}
details p{margin:8px 0 0;padding:10px 12px;background:#fff;border-radius:6px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 12px}
.mini{padding:6px 12px;font-size:.85rem;background:#fff;color:var(--deep);border:2px solid var(--deep)}
.mini[aria-pressed=true]{background:var(--deep);color:#fff}
.stampline{font-size:.85rem;color:#3d6580}
.recent{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:6px 12px;border:2px solid var(--deep);border-radius:999px;background:#fff;color:var(--deep);font-size:.85rem}
.linklike{background:none;border:0;color:var(--aqua);text-decoration:underline;padding:6px;font-size:.85rem}
.linklike:hover{background:none;color:var(--deep)}
.alt{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.alt:hover{background:var(--aqua);color:#fff}
.qrbox{position:fixed;inset:0;background:rgba(10,61,98,.92);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.qrbox[hidden]{display:none}
.qrin{background:#fff;border-radius:10px;padding:16px;max-width:420px;width:100%;text-align:center}
#qrcv canvas{width:100%;max-width:300px;height:auto;image-rendering:pixelated}
#qrvideo{width:100%;border-radius:6px;background:#000}
.err{color:var(--bad);font-weight:600}.muted{color:#3d6580}
footer a{color:var(--aqua)}
footer{margin-top:40px;font-size:.85rem;color:#3d6580;max-width:60ch}
@media (prefers-reduced-motion:no-preference){.pad{animation:fill .5s ease backwards}.pad:nth-child(2){animation-delay:.08s}.pad:nth-child(3){animation-delay:.16s}.pad:nth-child(4){animation-delay:.24s}.pad:nth-child(5){animation-delay:.32s}.pad:nth-child(6){animation-delay:.4s}.pad:nth-child(7){animation-delay:.48s}.pad:nth-child(8){animation-delay:.56s}@keyframes fill{from{opacity:0;transform:scaleY(.3)}}}
.top{align-items:center;margin-bottom:18px}
.top button{border-radius:999px;padding:6px 14px;border:2px solid var(--deep);background:#fff;color:var(--deep);font-size:.85rem}
.top button[aria-pressed=true]{background:var(--deep);color:#fff}
.field{position:relative;flex:1 1 280px;display:flex}
.field input{flex:1;padding-right:56px}
.icon{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;color:var(--deep);border:2px solid var(--deep)}
.field .icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0}
.icon svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:hover,.btn.ghost:hover{background:var(--deep);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--deep);padding:8px 14px}
.vcard{background:#fff;border:2px solid var(--deep);border-left-width:10px;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.vcard.ok{border-left-color:var(--ok)}.vcard.warn{border-left-color:var(--warn)}.vcard.bad{border-left-color:var(--bad)}.vcard.info{border-left-color:var(--aqua)}.vcard.unknown{border-left-color:var(--unk)}
.vcard h2{margin:0}.vcard .strip{margin-top:12px;border-width:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;color:var(--deep);border:2px solid var(--deep);font-size:.85rem}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--unk)}
.live.on .dot{background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.shw{position:relative;margin-left:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:#fff;border:2px solid var(--deep);border-radius:10px;padding:6px;z-index:5;box-shadow:0 8px 24px rgba(10,61,98,.2)}
.menu[hidden]{display:none}
.mi{display:block;width:100%;text-align:left;background:none;color:var(--deep);padding:10px 12px;border-radius:6px;font-weight:600}
.mi:hover{background:var(--tile)}
.know{background:#fff;border-left:6px solid var(--aqua);border-radius:6px;padding:12px 16px;margin:0 0 14px}
.know h3{margin:0 0 6px;font-size:1rem}.know ul{padding-left:18px;margin:0;list-style:disc}.know li{margin:4px 0}.know p{margin:0}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:700;color:#fff;vertical-align:middle}
.qrin .btn{margin:4px}
body{background:linear-gradient(180deg,#E6F4F2 0,var(--tile) 320px)}
main{max-width:760px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand svg{width:38px;height:38px;fill:none;stroke:var(--aqua);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{margin:0}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin:-12px 0 22px}
.trust span{padding:4px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--deep)}
.field .icon{width:34px;height:34px}
.field #qrup{right:46px}
.field input{padding-right:96px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:36px}
.tiles div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(10,61,98,.06)}
.tiles h3{margin:0 0 4px;font-size:1rem}.tiles p{margin:0;color:#3d6580;font-size:.92rem}
.scanned .tiles{display:none}
.vcard,.know,.rows,.tiles div{box-shadow:0 1px 2px rgba(10,61,98,.06),0 8px 24px rgba(10,61,98,.06)}
.rows{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-top:6px}
.rows .row:first-child{border-top:0}
button{transition:background .15s,color .15s,transform .05s}
button:active{transform:translateY(1px)}
</style>
</head>
<body>
<main>
<div class="top" role="group" aria-label="Language"><button id="en" type="button">English</button><button id="pcm" type="button">Pidgin</button></div>
<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><h1>Pool Shield</h1></div>
<p class="lead" id="lead"></p>
<div class="trust"><span id="t1"></span><span id="t2"></span><span id="t3"></span></div>
<form id="f">
<div class="field"><input id="mint" autocomplete="off" spellcheck="false" aria-label="Solana token address"><button type="button" id="qrup" class="icon"></button><button type="button" id="qr" class="icon"></button></div>
<button type="submit" id="go" class="btn"></button>
<input type="file" id="qrfile" accept="image/*" hidden>
</form>
<div id="qrbox" class="qrbox" hidden><div class="qrin"><video id="qrvideo" playsinline muted></video><p id="qrmsg"></p><button type="button" id="qrphoto" class="btn ghost"></button> <button type="button" id="qrclose" class="btn ghost"></button></div></div>
<div id="recent" class="recent"></div>
<div id="examples" class="recent"></div>
<div id="qrout" class="qrbox" hidden><div class="qrin"><div id="qrcv"></div><p id="qrcap"></p><div class="ctl" style="justify-content:center"><button type="button" id="qrt1" class="mini"></button><button type="button" id="qrt2" class="mini"></button><button type="button" id="qrdl" class="btn"></button><button type="button" id="qrx" class="btn ghost"></button></div></div></div>
<div id="out" aria-live="polite"></div>
<section id="features" class="tiles"><div><h3 id="f1t"></h3><p id="f1d"></p></div><div><h3 id="f2t"></h3><p id="f2d"></p></div><div><h3 id="f3t"></h3><p id="f3d"></p></div></section>
<footer><p id="foot"></p><p><a id="lm" href="/methodology"></a> | <a id="lr" href="https://github.com/NuesPoll/pool-shield/issues" target="_blank" rel="noopener noreferrer"></a><span id="fbwrap" hidden> | <a id="lf" target="_blank" rel="noopener noreferrer"></a></span></p></footer>
</main>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
