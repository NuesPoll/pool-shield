name: Pool Shield CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Firebase Admin imports
        run: node -e "require('firebase-admin/app'); require('firebase-admin/app-check'); require('./api/ai-followup')"
      - name: Scanner unit tests
        run: npm test
      - name: API regression tests
        run: node tests/api.js
      - run: node tests/ai-quota.js
      - run: node tests/ai-evidence.js
      - run: node tests/ai-gateway.js
      - name: Server JavaScript syntax
        run: |
          node --check server.js
          node --check api/scan.js
          node --check lib/scan.js
          node --check lib/ai-provider.js
          node --check api/ai-followup.js
      - name: Browser JavaScript syntax
        run: |
          node --check public/theme.js
          node --check public/workspace.js
          node --check public/app.js
          node --input-type=module --check < public/ai.js
